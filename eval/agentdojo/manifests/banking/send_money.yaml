# Send money from the user's account to a recipient. Irreversible and moves money out, so tier 3 with egress.
# The recipient IBAN is the destination and must trace to a trusted source. The subject is free text that can carry
# data out, so it is content and goes through DLP. The reply is the bank's confirmation message (operator_content).
# The amount and (where present) recurring flag are traced controls (`trace: true`): the Gate checks that each
# came from the user's prompt or from the user's or operator's own records, and parks the call for the user if not.
# The amount is also bounded to 0-100000.
# The date is not traced: the posting date is usually "today", which no prompt or record states, and a wrong date
# delays a payment to the right recipient rather than redirecting it (an accepted limit, docs/redteam/whitebox-oct29.md).
tool: banking.send_money
description: Send a payment from the user's account to the recipient IBAN.
tier: 3
egress: true
args:
  recipient: {type: iban,   role: destination}
  amount:    {type: number, role: control, trace: true, min: 0, max: 100000}
  subject:   {type: text,   role: content, max_len: 200, single_line: true}
  date:      {type: date,   role: control}
output:
  message: {type: text, region: operator_content, confidential: public}
