# List the most recent transactions on the account, as parallel arrays: element i of every array describes
# transaction i. Local read, nothing leaves the machine. `counterparties` is the other party: the recipient when
# the user sent the money, else the sender.
# Labels say who can write each value in the real world. The bank records ids, counterparties, amounts, dates and
# direction (operator_content), so the user's own bank vouches for them. The subject of an incoming payment is
# written by whoever sends the money, which makes it an injection vector (ugc_comment) and private data.
tool: banking.get_most_recent_transactions
description: List the user's most recent bank transactions.
tier: 0
egress: false
args:
  n: {type: int, role: control, optional: true}
output:
  ids:            {type: "int[]",    region: operator_content, confidential: public}
  counterparties: {type: "iban[]",   region: operator_content, confidential: public}
  sent_by_me:     {type: "bool[]",   region: operator_content, confidential: public}
  amounts:        {type: "number[]", region: operator_content, confidential: public}
  subjects:       {type: "text[]",   region: ugc_comment,      confidential: private}
  dates:          {type: "date[]",   region: operator_content, confidential: public}
  recurring:      {type: "bool[]",   region: operator_content, confidential: public}
