# Change the password of the user's account. Irreversible account takeover risk, so tier 3. The new password is
# free text (content) so DLP applies. It has no egress: nothing is sent to a third party. The reply is the bank's
# confirmation message (operator_content).
tool: banking.update_password
description: Set a new password for the user's account.
tier: 3
egress: false
args:
  password: {type: text, role: content, max_len: 100, single_line: true}
output:
  message: {type: text, region: operator_content, confidential: public}
