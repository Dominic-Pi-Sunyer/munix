# Rating and reviews for the named hotels, as parallel arrays. Local read. The hotel names are controls. The name and
# the numeric rating are the platform's own listing data (product_listing). The reviews are written by strangers
# who stayed (or say they did): anyone can post one, so they are ugc_review, the lowest-trust review region, and
# they are the injection vector (AgentDojo's injection_hotels_* slots are review text). One text per hotel: that
# hotel's reviews joined with line breaks. Public: reviews are published.
tool: travel.get_rating_reviews_for_hotels
description: Get the rating and the reviews of the named hotels.
tier: 0
egress: false
args:
  hotel_names: {type: "text[]", role: control, max: 20, max_len: 100}
output:
  names: {type: "text[]", region: product_listing, confidential: public}
  ratings: {type: "number[]", region: product_listing, confidential: public}
  reviews: {type: "text[]", region: ugc_review, confidential: public}
