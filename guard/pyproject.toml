[project]
name = "munix-guard"
version = "0.1.0"
description = "Loopback sidecar serving Llama Prompt Guard 2 (22M) as an injection classifier for Munix"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<3",
    "transformers>=4.46,<5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
