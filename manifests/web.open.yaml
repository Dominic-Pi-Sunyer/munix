# Open a web page and return its text and links. Everything it returns is untrusted until the Gate scores it.
tool: web.open
description: Open a web page and return its text and the links on it.
tier: 1
egress: true
args:
  url: {type: url, role: destination}
output:
  page:  {type: text,  region: unclassified, confidential: public}
  links: {type: "url[]", region: unclassified, confidential: public}
