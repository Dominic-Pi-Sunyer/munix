<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munix Dashboard</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #131a26;
    --panel-alt: #182132;
    --border: #263248;
    --text: #f0f4f8;
    --muted: #94a3b8;
    --green: #22c55e;
    --green-bg: rgba(34, 197, 94, 0.14);
    --yellow: #eab308;
    --yellow-bg: rgba(234, 179, 8, 0.15);
    --orange: #f97316;
    --orange-bg: rgba(249, 115, 22, 0.15);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.18);
    --blue: #38bdf8;
    --blue-bg: rgba(56, 189, 248, 0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  select {
    background: var(--panel-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .badge {
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    border: 1px solid transparent;
  }
  .badge-ok {
    color: var(--green);
    background: var(--green-bg);
    border-color: rgba(34, 197, 94, 0.4);
  }
  .badge-err {
    color: var(--red);
    background: var(--red-bg);
    border-color: rgba(239, 68, 68, 0.5);
  }
  .live-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }
  .live-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #475569;
  }
  .live-dot.active {
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 20px;
    padding: 20px 24px;
    overflow: hidden;
  }
  .left-col {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .gauge-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .trust-num {
    font-size: 48px;
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .band-name {
    font-size: 20px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 6px;
  }
  .bar-track {
    width: 100%;
    height: 14px;
    background: #090d14;
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.25s ease, background-color 0.25s ease;
  }
  .chart-svg {
    width: 100%;
    height: 96px;
    display: block;
    background: #0c111b;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .tile-val {
    font-size: 28px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .tile-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    margin-top: 4px;
  }
  .seal-tile {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
  }
  .seal-broken {
    background: var(--red-bg);
    border-color: var(--red);
    color: #fecaca;
  }
  .right-col {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .timeline-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .timeline {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: grid;
    grid-template-columns: 78px 26px 1fr;
    align-items: start;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--panel-alt);
    border-left: 4px solid var(--border);
    font-size: 15px;
  }
  .row-time {
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    padding-top: 2px;
  }
  .row-icon {
    font-weight: 800;
    text-align: center;
  }
  .row-body {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .row-line {
    font-weight: 600;
    word-break: break-word;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(148, 163, 184, 0.14);
    color: #cbd5e1;
  }
  .subline {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    color: #cbd5e1;
    padding-left: 10px;
    border-left: 2px solid var(--border);
  }
  .row-green { border-left-color: var(--green); }
  .row-yellow { border-left-color: var(--yellow); }
  .row-orange { border-left-color: var(--orange); }
  .row-red { border-left-color: var(--red); }
  .row-blue { border-left-color: var(--blue); }
  .row-alert {
    background: var(--red-bg);
    border: 1px solid var(--red);
    border-left: 6px solid var(--red);
    color: #fee2e2;
  }
  footer {
    padding: 10px 24px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Munix</div>
    <select id="run-picker" aria-label="Select run"></select>
    <div id="chain-badge" class="badge badge-ok">No run selected</div>
    <div class="live-wrap">
      <span id="live-dot" class="live-dot"></span>
      <span id="live-text">Idle</span>
    </div>
  </header>

  <main>
    <section class="left-col">
      <div class="card">
        <div class="section-label">Context Trust</div>
        <div class="gauge-top">
          <div id="trust-num" class="trust-num">100</div>
          <div id="band-name" class="band-name">Clean</div>
        </div>
        <div class="bar-track">
          <div id="bar-fill" class="bar-fill"></div>
        </div>
        <svg id="trust-chart" class="chart-svg" viewBox="0 0 360 96" preserveAspectRatio="none"></svg>
      </div>

      <div class="stats-grid">
        <div class="tile"><div id="stat-allow" class="tile-val">0</div><div class="tile-label">Allowed</div></div>
        <div class="tile"><div id="stat-deny" class="tile-val">0</div><div class="tile-label">Denied by code</div></div>
        <div class="tile"><div id="stat-gray" class="tile-val">0</div><div class="tile-label">Sent to reviewer</div></div>
        <div class="tile"><div id="stat-user" class="tile-val">0</div><div class="tile-label">Asked the user</div></div>
        <div class="tile"><div id="stat-takeover" class="tile-val">0</div><div class="tile-label">Takeovers stopped</div></div>
        <div class="tile"><div id="stat-recover" class="tile-val">0</div><div class="tile-label">Recoveries</div></div>
        <div id="seal-tile" class="tile seal-tile">Unsealed</div>
      </div>
    </section>

    <section class="right-col">
      <div class="timeline-head">Decision Timeline</div>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <footer id="footer-line">Read-only view of runs/&lt;task&gt;.ledger.jsonl</footer>

<script>
(function () {
  const picker = document.getElementById('run-picker');
  const chainBadge = document.getElementById('chain-badge');
  const liveDot = document.getElementById('live-dot');
  const liveText = document.getElementById('live-text');
  const trustNum = document.getElementById('trust-num');
  const bandName = document.getElementById('band-name');
  const barFill = document.getElementById('bar-fill');
  const trustChart = document.getElementById('trust-chart');
  const statAllow = document.getElementById('stat-allow');
  const statDeny = document.getElementById('stat-deny');
  const statGray = document.getElementById('stat-gray');
  const statUser = document.getElementById('stat-user');
  const statTakeover = document.getElementById('stat-takeover');
  const statRecover = document.getElementById('stat-recover');
  const sealTile = document.getElementById('seal-tile');
  const timeline = document.getElementById('timeline');
  const footerLine = document.getElementById('footer-line');

  let runsList = [];
  let selectedTask = null;
  let userPicked = false;
  let pinnedBottom = true;

  timeline.addEventListener('scroll', function () {
    const gap = timeline.scrollHeight - timeline.scrollTop - timeline.clientHeight;
    pinnedBottom = gap < 32;
  });

  picker.addEventListener('change', function () {
    userPicked = true;
    selectedTask = picker.value || null;
    pinnedBottom = true;
    updateFooter();
    pollSelectedRun();
  });

  function bandInfo(score) {
    if (score >= 80) return { name: 'Clean', color: '#22c55e', bg: 'rgba(34, 197, 94, 0.16)' };
    if (score >= 50) return { name: 'Elevated', color: '#eab308', bg: 'rgba(234, 179, 8, 0.16)' };
    if (score >= 20) return { name: 'Restricted', color: '#f97316', bg: 'rgba(249, 115, 22, 0.16)' };
    return { name: 'Lockdown', color: '#ef4444', bg: 'rgba(239, 68, 68, 0.18)' };
  }

  function shortHex(digest) {
    if (typeof digest !== 'string') return '';
    return digest.replace(/^sha256:/, '').slice(0, 12);
  }

  function formatTime(tsMs) {
    if (typeof tsMs !== 'number') return '--:--:--';
    const d = new Date(tsMs);
    const pad = function (n) { return String(n).padStart(2, '0'); };
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function updateFooter() {
    const t = selectedTask || '<task>';
    footerLine.textContent = 'Read-only view of runs/' + t + '.ledger.jsonl';
  }

  function renderChart(points, currentColor) {
    trustChart.replaceChildren();
    const ns = 'http://www.w3.org/2000/svg';
    const w = 360;
    const h = 96;
    const padY = 10;
    const usableH = h - padY * 2;

    [20, 50, 80].forEach(function (lvl) {
      const y = padY + usableH * (1 - lvl / 100);
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', '0');
      line.setAttribute('y1', String(y));
      line.setAttribute('x2', String(w));
      line.setAttribute('y2', String(y));
      line.setAttribute('stroke', '#1e293b');
      line.setAttribute('stroke-dasharray', '4 4');
      trustChart.appendChild(line);
    });

    if (points.length === 0) return;
    const n = points.length;
    const coords = points.map(function (val, idx) {
      const x = n === 1 ? w : (idx / (n - 1)) * (w - 16) + 8;
      const clamped = Math.max(0, Math.min(100, val));
      const y = padY + usableH * (1 - clamped / 100);
      return { x: x, y: y };
    });

    let d = 'M ' + coords[0].x + ' ' + coords[0].y;
    for (let i = 1; i < coords.length; i++) {
      d += ' L ' + coords[i].x + ' ' + coords[i - 1].y;
      d += ' L ' + coords[i].x + ' ' + coords[i].y;
    }
    if (coords.length === 1) {
      d += ' L ' + (w - 8) + ' ' + coords[0].y;
    }

    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', currentColor);
    path.setAttribute('stroke-width', '3');
    trustChart.appendChild(path);
  }

  function buildTimelineRow(tsMs, iconText, colorClass, mainText, chips, sublines, isAlert) {
    const row = document.createElement('div');
    row.className = 'row ' + (isAlert ? 'row-alert' : colorClass);

    const timeEl = document.createElement('div');
    timeEl.className = 'row-time';
    timeEl.textContent = formatTime(tsMs);

    const iconEl = document.createElement('div');
    iconEl.className = 'row-icon';
    iconEl.textContent = iconText;

    const bodyEl = document.createElement('div');
    bodyEl.className = 'row-body';

    const lineEl = document.createElement('div');
    lineEl.className = 'row-line';
    lineEl.textContent = mainText;
    bodyEl.appendChild(lineEl);

    if (chips && chips.length > 0) {
      const chipWrap = document.createElement('div');
      chipWrap.className = 'chips';
      chips.forEach(function (c) {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = String(c);
        chipWrap.appendChild(chip);
      });
      bodyEl.appendChild(chipWrap);
    }

    if (sublines && sublines.length > 0) {
      sublines.forEach(function (s) {
        const sub = document.createElement('div');
        sub.className = 'subline';
        sub.textContent = s;
        bodyEl.appendChild(sub);
      });
    }

    row.appendChild(timeEl);
    row.appendChild(iconEl);
    row.appendChild(bodyEl);
    return row;
  }

  function renderRun(data, meta) {
    const entries = Array.isArray(data.entries) ? data.entries : [];
    if (data.verified) {
      chainBadge.className = 'badge badge-ok';
      chainBadge.textContent = 'Ledger verified \u00b7 ' + entries.length + ' entries';
    } else {
      chainBadge.className = 'badge badge-err';
      chainBadge.textContent = 'Ledger check failed';
    }

    const isLive = meta && typeof meta.modified_ms === 'number' && (Date.now() - meta.modified_ms < 10000);
    liveDot.className = isLive ? 'live-dot active' : 'live-dot';
    liveText.textContent = isLive ? 'LIVE' : 'Idle';

    let trust = 100;
    const trustSeries = [];
    let allowCount = 0;
    let denyCount = 0;
    let grayCount = 0;
    let userCount = 0;
    let takeoverCount = 0;
    let recoverCount = 0;
    let sealHex = null;
    let sealBroken = false;

    const rows = [];
    let pendingTools = [];
    let pendingToolsTs = 0;

    function flushTools() {
      if (pendingTools.length > 0) {
        rows.push(buildTimelineRow(
          pendingToolsTs,
          '\u2699',
          'row-blue',
          'Tools registered: ' + pendingTools.join(', '),
          null,
          null,
          false
        ));
        pendingTools = [];
      }
    }

    entries.forEach(function (entry) {
      const ev = entry && entry.event ? entry.event : {};
      const kind = String(ev.event || 'unknown');
      const ts = entry.ts_ms;

      if (kind === 'tool_registered') {
        if (pendingTools.length === 0) pendingToolsTs = ts;
        pendingTools.push(String(ev.tool || '?'));
        return;
      }
      flushTools();

      if (kind === 'request') {
        return;
      }

      if (kind === 'task_started') {
        trust = 100;
        trustSeries.push(trust);
        let text = 'Task ' + String(ev.task || '') + ' started with signed plan ' + String(ev.plan || '');
        if (ev.seal) {
          sealHex = shortHex(String(ev.seal));
          text += ' \u00b7 seal ' + sealHex;
        }
        rows.push(buildTimelineRow(ts, '\u25b6', 'row-green', text, null, null, false));
      } else if (kind === 'ruling') {
        const outcome = String(ev.outcome || '');
        let label = outcome.toUpperCase();
        let color = 'row-blue';
        let icon = '\u2022';
        if (outcome === 'allow') {
          allowCount++;
          label = 'ALLOWED';
          color = 'row-green';
          icon = '\u2713';
        } else if (outcome === 'deny' || outcome === 'malformed') {
          const code = String(ev.code || 'malformed');
          if (code === 'user_denied') {
            label = 'DENIED (you said no)';
          } else if (code === 'reviewer') {
            label = 'DENIED (reviewer)';
          } else {
            denyCount++;
            label = 'DENIED (' + code + ')';
          }
          color = 'row-red';
          icon = '\u2715';
        } else if (outcome === 'gray') {
          grayCount++;
          label = 'SENT TO REVIEWER';
          color = 'row-yellow';
          icon = '\u25d0';
        } else if (outcome === 'confirm_user') {
          userCount++;
          label = 'ASKED THE USER';
          color = 'row-blue';
          icon = '?';
        }
        const chips = Array.isArray(ev.reasons) ? ev.reasons : (Array.isArray(ev.violations) ? ev.violations : []);
        const line = 'Step ' + String(ev.step ?? '?') + ' ' + String(ev.tool || '?') + ': ' + label;
        rows.push(buildTimelineRow(ts, icon, color, line, chips, null, false));
      } else if (kind === 'executed') {
        let line = String(ev.tool || '?') + ' ran';
        if (Array.isArray(ev.withheld) && ev.withheld.length > 0) {
          line += ' \u00b7 withheld: ' + ev.withheld.join(', ');
        }
        if (ev.ok === false) {
          line += ' \u00b7 failed';
        }
        rows.push(buildTimelineRow(ts, '\u26a1', ev.ok === false ? 'row-red' : 'row-green', line, null, null, false));
      } else if (kind === 'context_lowered') {
        if (typeof ev.to === 'number') {
          trust = ev.to;
          trustSeries.push(trust);
        }
        const line = 'Context trust ' + String(ev.from ?? '?') + ' \u2192 ' + String(ev.to ?? '?') + ' after ' + String(ev.tool || '?');
        rows.push(buildTimelineRow(ts, '\u2193', 'row-orange', line, null, null, false));
      } else if (kind === 'decision') {
        const who = ev.stage === 'llm_review' ? 'Reviewer (Muse Spark)' : (ev.stage === 'user' ? 'You' : String(ev.stage || 'Decision'));
        const verdict = String(ev.verdict || '');
        const color = verdict === 'approve' ? 'row-green' : (verdict === 'confirm_user' ? 'row-blue' : 'row-red');
        rows.push(buildTimelineRow(ts, '\u2696', color, who + ': ' + verdict, ev.reasons, null, false));
      } else if (kind === 'decision_refused') {
        rows.push(buildTimelineRow(ts, '\u2715', 'row-red', 'Decision refused: ' + String(ev.reason || ''), null, null, false));
      } else if (kind === 'takeover') {
        takeoverCount++;
        const onTool = ev.tool ? String(ev.tool) : 'null';
        const line = 'TAKEOVER STOPPED: ' + String(ev.code || 'unknown') + ' on ' + onTool + ' \u00b7 task halted';
        rows.push(buildTimelineRow(ts, '\u26d4', 'row-red', line, null, null, true));
      } else if (kind === 'recovered') {
        recoverCount++;
        trust = 100;
        trustSeries.push(trust);
        const items = Array.isArray(ev.quarantined) ? ev.quarantined : [];
        const line = 'Recovery ' + String(ev.attempt ?? 1) + ': fresh agent at trust 100, withheld ' + items.length + ' item(s)';
        const subs = items.map(function (q) {
          const idx = (q.index !== null && q.index !== undefined) ? '[' + q.index + ']' : '';
          return 'step ' + String(q.step ?? '?') + ' ' + String(q.field || '') + idx +
            ' (' + String(q.region || '') + ', trust ' + String(q.trust ?? '?') + ') \u00b7 ' + String(q.cause || '');
        });
        rows.push(buildTimelineRow(ts, '\u21bb', 'row-green', line, null, subs, false));
      } else if (kind === 'watchdog_trip') {
        const line = 'Watchdog: ' + String(ev.reason || '') + ' \u00b7 agent stopped';
        rows.push(buildTimelineRow(ts, '\u23f1', 'row-red', line, null, null, false));
      } else if (kind === 'paused') {
        const line = 'Paused after ' + String(ev.denials ?? '?') + ' denials on step ' + String(ev.step ?? '?') + ' \u00b7 the user decides';
        rows.push(buildTimelineRow(ts, '\u23f8', 'row-yellow', line, null, null, false));
      } else if (kind === 'tamper_detected') {
        sealBroken = true;
        const line = 'INTEGRITY SEAL BROKEN: ' + String(ev.path || '') + ' changed \u00b7 every task stopped';
        rows.push(buildTimelineRow(ts, '\u26a0', 'row-red', line, null, null, true));
      } else {
        rows.push(buildTimelineRow(ts, '\u2022', 'row-blue', kind, null, null, false));
      }
    });
    flushTools();

    const band = bandInfo(trust);
    trustNum.textContent = String(trust);
    trustNum.style.color = band.color;
    bandName.textContent = band.name;
    bandName.style.color = band.color;
    bandName.style.backgroundColor = band.bg;
    barFill.style.width = Math.max(0, Math.min(100, trust)) + '%';
    barFill.style.backgroundColor = band.color;
    renderChart(trustSeries.length ? trustSeries : [100], band.color);

    statAllow.textContent = String(allowCount);
    statDeny.textContent = String(denyCount);
    statGray.textContent = String(grayCount);
    statUser.textContent = String(userCount);
    statTakeover.textContent = String(takeoverCount);
    statRecover.textContent = String(recoverCount);

    if (sealBroken) {
      sealTile.className = 'tile seal-tile seal-broken';
      sealTile.textContent = 'Seal broken';
    } else if (sealHex) {
      sealTile.className = 'tile seal-tile';
      sealTile.textContent = 'Sealed \u00b7 ' + sealHex;
    } else {
      sealTile.className = 'tile seal-tile';
      sealTile.textContent = 'Unsealed';
    }

    const wasPinned = pinnedBottom;
    timeline.replaceChildren();
    rows.forEach(function (r) { timeline.appendChild(r); });
    if (wasPinned) {
      timeline.scrollTop = timeline.scrollHeight;
    }
  }

  async function pollSelectedRun() {
    if (!selectedTask) return;
    try {
      const res = await fetch('/api/runs/' + encodeURIComponent(selectedTask), { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      const meta = runsList.find(function (r) { return r.task === selectedTask; });
      renderRun(data, meta);
    } catch (_) {}
  }

  async function pollRuns() {
    try {
      const res = await fetch('/api/runs', { cache: 'no-store' });
      if (!res.ok) return;
      runsList = await res.json();
      picker.replaceChildren();
      runsList.forEach(function (r) {
        const opt = document.createElement('option');
        opt.value = r.task;
        opt.textContent = r.task + ' (' + r.entries + ')';
        picker.appendChild(opt);
      });
      if (runsList.length > 0) {
        const stillExists = selectedTask && runsList.some(function (r) { return r.task === selectedTask; });
        if (!userPicked || !stillExists) {
          selectedTask = runsList[0].task;
        }
        picker.value = selectedTask;
        updateFooter();
      }
    } catch (_) {}
  }

  pollRuns().then(pollSelectedRun);
  setInterval(pollRuns, 2000);
  setInterval(pollSelectedRun, 1000);
})();
</script>
</body>
</html>
